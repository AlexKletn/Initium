[package]
name = "initium-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
drm = "0.14.1"
glob = "0.3"
initium-config = { path = "../initium-config" }
libc = "0.2"
lvgl-rust = { version = "=0.3.1", default-features = false, features = ["color_depth_32", "fmt"] }

[[test]]
name = "display"
path = "tests/display.tests.rs"

[build-dependencies]
cc = "1"
